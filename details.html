<!-- details.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Details Form</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container center">
    <h2>Enter Your Details</h2>
    <form id="detailsForm">
      <input name="username" placeholder="Your Full Name" required /><br><br>
      <input name="email" type="email" placeholder="Email" required /><br><br>
      <input name="phone" type="tel" pattern="[0-9]{10}" placeholder="Phone Number (10 digits)" required /><br><br>
      <input name="linkedin" type="url" placeholder="LinkedIn URL" required /><br><br>

      <label>Career Objective</label><br>
      <textarea name="objective" placeholder="Use **bold** and line breaks with Enter" required></textarea><br><br>

      <label>Undergraduate (UG)</label><br>
      <input name="ug_degree" placeholder="Degree Name" required />
      <input name="ug_college" placeholder="College Name" required />
      <input name="ug_percentage" type="number" step="0.01" placeholder="Percentage (%)" required /><br><br>

      <label>PUC</label><br>
      <input name="puc_college" placeholder="College Name" required />
      <input name="puc_percentage" type="number" step="0.01" placeholder="Percentage (%)" required /><br><br>

      <label>SSLC</label><br>
      <input name="sslc_school" placeholder="School Name" required />
      <input name="sslc_percentage" type="number" step="0.01" placeholder="Percentage (%)" required /><br><br>

      <label>Skills</label><br>
      <textarea name="skills" placeholder="Use **bold**, commas, and line breaks" required></textarea><br><br>

      <label>Experience</label><br>
      <textarea name="experience" placeholder="Use **bold** and line breaks" required></textarea><br><br>

      <label>Projects</label><br>
      <textarea name="projects" placeholder="Use **bold** and line breaks" required></textarea><br><br>

      <button type="submit">Generate Resume</button>
    </form>
  </div>

  <script>
    document.getElementById('detailsForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const formData = new FormData(e.target);
      const userDetails = {};
      formData.forEach((value, key) => userDetails[key] = value.trim());

      localStorage.setItem('resumeData', JSON.stringify(userDetails));
      localStorage.setItem('username', userDetails.username);

      window.location.href = "template.html";
    });
  </script>
</body>
</html>
