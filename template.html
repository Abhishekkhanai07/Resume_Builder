<!-- template.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Select Resume Template</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .container {
      max-width: 800px;
      margin: 50px auto;
      padding: 30px;
      background-color: #fff;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
    }
    h2 {
      margin-bottom: 30px;
      font-size: 28px;
      color: #333;
    }
    button {
      padding: 12px 24px;
      margin: 10px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      background-color: #007bff;
      color: white;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Select Resume Template</h2>
    <button onclick="selectTemplate('template1')">Classic</button>
    <button onclick="selectTemplate('template2')">Modern</button>
    <button onclick="selectTemplate('template3')">Creative</button>
  </div>

  <script>
    function selectTemplate(template) {
      localStorage.setItem('selectedTemplate', template);
      window.location.href = "resume.html";
    }
  </script>
  <script>
  function selectTemplate(template) {
    localStorage.setItem('selectedTemplate', template);
    window.location.href = "resume.html"; // Redirect to resume page
  }
</script>

</body>
</html>
